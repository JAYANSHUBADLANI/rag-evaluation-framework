[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-framework"
version = "0.1.0"
description = "A statistically rigorous evaluation framework for retrieval-augmented generation pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jayanshu Badlani" }]
keywords = ["retrieval", "evaluation", "information-retrieval", "rag", "statistics"]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "faiss-cpu>=1.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0"]

[project.scripts]
rag-eval = "rag_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
