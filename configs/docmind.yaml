# Case study: the retrieval stack of my DocMind PDF chatbot
# (https://github.com/JAYANSHUBADLANI/rag-pdf-chatbot), measured with this
# framework instead of eyeballed.
#
# Three configurations along the axes that stack actually uses:
#   * tfidf_baseline  - the offline default, for reference
#   * minilm          - dense retrieval with all-MiniLM-L6-v2 (DocMind's embedder)
#   * minilm_rerank   - the full DocMind stack: over-retrieve 12 candidates,
#                       rerank with the ms-marco cross-encoder, keep top 5
#
# The question the comparisons answer: does each stage of the production stack
# buy a statistically defensible improvement, or does it just feel better?

corpus_path: demo/corpus
eval_path: demo/eval_set.json
output_dir: results/docmind

seed: 20240517
ks: [1, 3, 5]
alpha: 0.05
n_boot: 10000
n_perm: 10000
answer_sentences: 2
# Retrieval saturates on this corpus (topics are well separated), so the
# discriminating metric is how well the selected context serves the answer.
primary_metric: answer_relevance

embedder:
  name: tfidf
  svd_dim: 128

index_kind: faiss

judge:
  name: local
  faithfulness_threshold: 0.5
  utilization_threshold: 0.5

configs:
  - name: tfidf_baseline
    chunk_size: 128
    overlap: 20
    top_k: 5
  - name: minilm
    chunk_size: 128
    overlap: 20
    top_k: 5
    embedder:
      name: sentence-transformers
      model_name: sentence-transformers/all-MiniLM-L6-v2
  - name: minilm_rerank
    chunk_size: 128
    overlap: 20
    top_k: 5
    embedder:
      name: sentence-transformers
      model_name: sentence-transformers/all-MiniLM-L6-v2
    rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
    rerank_candidates: 12

comparisons:
  - [tfidf_baseline, minilm]   # does dense embedding beat offline TF-IDF?
  - [minilm, minilm_rerank]    # does the cross-encoder stage add anything?
